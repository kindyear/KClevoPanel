name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version=([xml](Get-Content App/KClevoPanel.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if($env:TAG -ne "v$version"){throw 'Tag and app version must match'}
          if(!(Test-Path "docs/releases/$($env:TAG).md")){throw 'Release notes are required'}
      - name: Portable protocol and logic tests
        shell: pwsh
        run: |
          dotnet run --project Diagnostics/KClevoPanel.Diagnostics.csproj -c Release -- --self-test --portable
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
      - name: Publish and package MSI and ZIP
        shell: pwsh
        run: ./packaging/build-release.ps1
      - name: Verify MSI install and uninstall
        shell: pwsh
        run: |
          $msi=Get-ChildItem artifacts/release/*.msi | Select-Object -First 1
          ./packaging/verify-install.ps1 -Msi $msi.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          if-no-files-found: error
          path: |
            artifacts/release/*.msi
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-release
          path: release
      - name: Create release with verified build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $files=(Get-ChildItem release -File).FullName
          gh release create $env:TAG @files --verify-tag --title "KClevoPanel $env:TAG" --notes-file "docs/releases/$($env:TAG).md"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
